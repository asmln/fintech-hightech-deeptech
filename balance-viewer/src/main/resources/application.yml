app.kafka.transaction.outbox.topic: user-balances

server:
  port: 8082

spring:
  application:
    name: balance-viewer

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # Идентификатор группы потребителей
      group-id: inbox-group
      # Отключение авто-комита
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.fasterxml.jackson.databind.node"
        spring.json.value.default.type: "com.fasterxml.jackson.databind.node.ObjectNode"
    listener:
      # Включаем ручное подтверждение
      # Доступные значения: manual, manual_immediate, record, batch
      ack-mode: manual
    threads.virtual.enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5433/balance_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  # Настройки Hibernate / JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false # Показывать SQL-запросы в консоли
    properties:
      hibernate:
        format_sql: true

  # Настройки миграций Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    table: flyway_schema_history
    encoding: UTF-8