services:
  # --- БД Транзакций ---
  payment-db:
    image: postgres:18.6
    container_name: tx-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tx_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password

  # --- БД Балансов ---
  balance-db:
    image: postgres:18.6
    container_name: balance-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: balance_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password

  # --- Брокер Kafka (Режим KRaft) ---
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # Настройки KRaft
      # ID брокера в кластере
      KAFKA_NODE_ID: 1
      # Роли этой ноды: и брокер и контроллер, который управляет кластером
      KAFKA_PROCESS_ROLES: 'broker,controller'
      # Голосующие за нового лидера - в этом случае власть в одних руках
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@127.0.0.1:9093'
      # Слушатели: 9092 для внешнего подключения (нашего Java-кода), 29092 для веб-морды, 9093 для KRaft
      KAFKA_LISTENERS: 'EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'EXTERNAL://localhost:9092,INTERNAL://kafka:29092'
      # Имя для контроллера (из маппинга ниже)
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      # Связь имён и протоколов (PLAINTEXT - незашифрованный траффик)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      # Автоматически создавать топики при первой отправке сообщений
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # Фактор репликации для офсетов
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Настройки для транзакций
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8079:8080" # Ссылка в браузере: http://localhost:8079
    depends_on:
      - kafka # Веб-морда поднимется только после старта брокера
    environment:
      # Название кластера в панели управления
      - KAFKA_CLUSTERS_0_NAME=local-kraft-cluster
      # URL для подключения внутри Docker-сети (используем внутренний порт 29092)
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
