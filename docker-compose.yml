version: '5.5.0'
services:
  # --- БД Транзакций ---
  payment-db:
    image: postgres:18.6
    container_name: payment-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password

  # --- БД Балансов ---
  balance-db:
    image: postgres:18.6
    container_name: balance-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: balance_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password