app.kafka.transaction.outbox.topic: user-balances

server:
  port: 8081

spring:
  application:
    name: tx-processor

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    threads.virtual.enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/tx_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  # Настройки Hibernate / JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false # Показывать SQL-запросы в консоли
    properties:
      hibernate:
        format_sql: true

  # Настройки миграций Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    table: flyway_schema_history
    encoding: UTF-8